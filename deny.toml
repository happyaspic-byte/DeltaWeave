# cargo-deny policy for production-readiness (Phase 1).
# Run locally with: cargo deny check
# CI runs the same command from .github/workflows/security.yml.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
# Unmaintained `paste` remains a transitive iroh/netlink dependency
# (RUSTSEC-2024-0436). Keep every other advisory fatal, including yanked crates.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "unmaintained paste 1.0.15 is still pulled by netlink-packet-core via iroh 1.1.0" },
]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "Unlicense",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
