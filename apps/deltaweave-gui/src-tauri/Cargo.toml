[package]
name = "deltaweave-gui"
description = "Light-only DeltaWeave desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "deltaweave_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
deltaweave-daemon = { path = "../../../crates/deltaweave-daemon" }
deltaweave-daemon-api = { path = "../../../crates/deltaweave-daemon-api" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(not(windows))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[lints]
workspace = true
