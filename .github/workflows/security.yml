name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        # These are unmaintained transitive-only crates still pulled by the
        # latest iroh/postcard graph (tracked in #7). Keep every other RustSec
        # warning fatal.
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2023-0089
          --ignore RUSTSEC-2024-0436
