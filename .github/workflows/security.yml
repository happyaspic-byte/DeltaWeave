name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        # Unmaintained paste remains a transitive iroh/netlink crate
        # (RUSTSEC-2024-0436). Keep every other RustSec warning, including
        # yanked crates, fatal.
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2024-0436

  fuzz-check:
    name: Fuzz workspace compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Check fuzz workspace
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.91.0"
          command: check
