name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        # paste is an unmaintained build-time proc macro pulled by iroh's
        # netlink graph (tracked in #7). No patched version exists; see
        # docs/SECURITY_REVIEW_2026-09-05.md. Keep every other warning fatal.
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2024-0436
