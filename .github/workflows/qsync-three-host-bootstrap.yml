name: QSync three-host bootstrap

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Exact source commit to verify'
        required: true
        type: string
      native_artifact_run_id:
        description: 'Prepare run that uploaded the passing Windows native artifact (metadata only during execute)'
        required: false
        default: ''
        type: string
      prebuilt_role_run_id:
        description: 'Prepare run whose immutable Linux/Windows role artifact is reused during execute'
        required: false
        default: ''
        type: string
      expected_file_hash:
        description: 'SHA-256 of the deterministic fixture selected for this run'
        required: true
        type: string
      expected_file_size:
        description: 'Byte size of the deterministic fixture selected for this run'
        required: true
        type: string
      coordination_run_id:
        description: 'Numeric run identifier generated by the controller and copied into both role records'
        required: true
        type: string
      execution_mode:
        description: 'prepare builds the role artifact; execute reuses a completed prepare run'
        required: false
        default: prepare
        type: string
      ro_share_key_secret_name:
        description: 'Per-run secret name mapped by the caller to QSYNC_F_RO_SHARE_KEY'
        required: false
        default: ''
        type: string
      execute_ro:
        description: 'Run the hosted Ubuntu read-only role against the supplied owner'
        required: false
        default: false
        type: boolean
      keepalive_seconds:
        description: 'Bounded RW provider window shared with the hosted RO role'
        required: false
        default: 300
        type: number
    secrets:
      QSYNC_F_RO_SHARE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact source commit to verify'
        required: true
        type: string
      native_artifact_run_id:
        description: 'Prepare run that uploaded the passing Windows native artifact (metadata only during execute)'
        required: false
        default: ''
        type: string
      prebuilt_role_run_id:
        description: 'Prepare run whose immutable Linux/Windows role artifact is reused during execute'
        required: false
        default: ''
        type: string
      expected_file_hash:
        description: 'SHA-256 of the deterministic fixture selected for this run'
        required: true
        type: string
      expected_file_size:
        description: 'Byte size of the deterministic fixture selected for this run'
        required: true
        type: string
      coordination_run_id:
        description: 'Numeric run identifier generated by the controller and copied into both role records'
        required: true
        type: string
      execution_mode:
        description: 'prepare builds the role artifact; execute reuses a completed prepare run'
        required: false
        default: prepare
        type: string
      ro_share_key_secret_name:
        description: 'Per-run secret name mapped by the caller to QSYNC_F_RO_SHARE_KEY'
        required: false
        default: ''
        type: string
      execute_ro:
        description: 'Run the hosted Ubuntu read-only role against the supplied owner'
        required: false
        default: false
        type: boolean
      keepalive_seconds:
        description: 'Bounded RW provider window shared with the hosted RO role'
        required: false
        default: 300
        type: number

permissions:
  contents: read
  actions: read

# The approved Windows provider is started and kept alive by the local
# controller
# downloads its redacted result. This workflow prepares immutable role artifacts or runs only
# the hosted RO role; it never receives WinRM or owner-admin credentials.
jobs:
  provenance-and-linux-build:
    name: F prepare role artifacts
    if: ${{ inputs.execution_mode == 'prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate immutable prepare inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          NATIVE_RUN_ID: ${{ inputs.native_artifact_run_id }}
          EXPECTED_HASH: ${{ inputs.expected_file_hash }}
          EXPECTED_SIZE: ${{ inputs.expected_file_size }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SIZE" =~ ^[0-9]+$ ]]
          test "$EXPECTED_SIZE" -eq 8388608
      - name: Checkout selected source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check checkout SHA
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "${#EXPECTED_SHA}" -eq 40
      - name: Download passing Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: qsync-native-windows-${{ inputs.native_artifact_run_id }}
          path: native-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.native_artifact_run_id }}
      - name: Verify Windows artifact
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 scripts/qsync_three_host_bootstrap.py validate-artifact \
            --source-sha "$SOURCE_SHA" \
            --manifest "$PWD/native-artifact/native-verification-manifest.json" \
            --binary "$PWD/native-artifact/deltaweave.exe"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dashboard assets
        run: |
          npm --prefix web ci
          npm --prefix web test -- --run
          npm --prefix web run build
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Build Linux role binary
        env:
          DELTAWEAVE_REQUIRE_WEB_ASSETS: '1'
        run: cargo build --locked --all-features --release -p deltaweave
      - name: Create role-specific manifest
        id: role-manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 scripts/qsync_make_role_manifest.py \
            --source-sha "$SOURCE_SHA" \
            --windows-manifest "$PWD/native-artifact/native-verification-manifest.json" \
            --windows-binary "$PWD/native-artifact/deltaweave.exe" \
            --linux-binary "$PWD/target/release/deltaweave" \
            --output "$PWD/f-role-manifest.json"
          echo "path=$PWD/f-role-manifest.json" >> "$GITHUB_OUTPUT"
      - name: Upload F provenance and role binaries
        uses: actions/upload-artifact@v4
        with:
          name: qsync-f-linux-role-${{ github.run_id }}
          path: |
            target/release/deltaweave
            f-role-manifest.json
          if-no-files-found: error
          retention-days: 7

  execute-role-artifacts:
    name: F verify prepared role artifacts
    if: ${{ inputs.execution_mode == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable execute inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREBUILT_RUN_ID: ${{ inputs.prebuilt_role_run_id }}
          EXPECTED_HASH: ${{ inputs.expected_file_hash }}
          EXPECTED_SIZE: ${{ inputs.expected_file_size }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREBUILT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SIZE" =~ ^[0-9]+$ ]]
          test "$EXPECTED_SIZE" -eq 8388608
      - name: Checkout selected source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download prepared role artifact
        uses: actions/download-artifact@v4
        with:
          name: qsync-f-linux-role-${{ inputs.prebuilt_role_run_id }}
          path: f-linux
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prebuilt_role_run_id }}
      - name: Verify prepared role provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          chmod u+x "$PWD/f-linux/deltaweave"
          python3 scripts/qsync_three_host_bootstrap.py validate-artifact \
            --source-sha "$SOURCE_SHA" \
            --manifest "$PWD/f-linux/f-role-manifest.json" \
            --binary "$PWD/f-linux/deltaweave" \
            --role ro_consumer

  hosted-ro-consumer:
    name: F hosted Ubuntu read-only consumer
    if: ${{ inputs.execution_mode == 'execute' && inputs.execute_ro }}
    needs: execute-role-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download prepared Linux role binary and manifest
        uses: actions/download-artifact@v4
        with:
          name: qsync-f-linux-role-${{ inputs.prebuilt_role_run_id }}
          path: f-linux
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prebuilt_role_run_id }}
      - name: Verify prepared Linux role artifact
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          chmod u+x "$PWD/f-linux/deltaweave"
          python3 scripts/qsync_three_host_bootstrap.py validate-artifact \
            --source-sha "$SOURCE_SHA" \
            --manifest "$PWD/f-linux/f-role-manifest.json" \
            --binary "$PWD/f-linux/deltaweave" \
            --role ro_consumer
      - name: Require per-run read-only key
        env:
          RO_SHARE_KEY: ${{ secrets.QSYNC_F_RO_SHARE_KEY }}
          RO_SECRET_NAME: ${{ inputs.ro_share_key_secret_name }}
        run: |
          [[ "$RO_SECRET_NAME" =~ ^[A-Za-z][A-Za-z0-9_-]{0,99}$ ]]
          test -n "$RO_SHARE_KEY"
      - name: Run hosted read-only role
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_HASH: ${{ inputs.expected_file_hash }}
          EXPECTED_SIZE: ${{ inputs.expected_file_size }}
          COORDINATION_RUN_ID: ${{ inputs.coordination_run_id }}
          QSYNC_F_RO_SHARE_KEY: ${{ secrets.QSYNC_F_RO_SHARE_KEY }}
        run: |
          python3 scripts/qsync_three_host_role.py \
            --source-sha "$SOURCE_SHA" \
            --run-id "$COORDINATION_RUN_ID" \
            --manifest "$PWD/f-linux/f-role-manifest.json" \
            --binary "$PWD/f-linux/deltaweave" \
            --run-parent "$RUNNER_TEMP" \
            --evidence-dir "$RUNNER_TEMP/qsync-f-evidence" \
            --share-key-env QSYNC_F_RO_SHARE_KEY \
            --expected-file-hash "$EXPECTED_HASH" \
            --expected-file-size "$EXPECTED_SIZE"
      - name: Upload safe read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsync-f-ro-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/qsync-f-evidence
          if-no-files-found: error
          retention-days: 7
