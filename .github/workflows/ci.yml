name: CI

run-name: DeltaWeave CI qsync-${{ inputs.qsync_three_host_coordination_id || github.run_id }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qsync_three_host:
        description: 'Run the gated F three-host bootstrap jobs'
        required: false
        default: false
        type: boolean
      qsync_three_host_execute:
        description: 'Run the hosted RO role with a controller handoff and per-run key'
        required: false
        default: false
        type: boolean
      qsync_three_host_coordination_id:
        description: 'Controller-generated numeric ID shared by the RW evidence and hosted RO run'
        required: false
        default: ''
        type: string
      qsync_three_host_ro_secret_name:
        description: 'Per-run secret name mapped to the reusable RO key slot'
        required: false
        default: ''
        type: string
      qsync_three_host_expected_file_hash:
        description: 'SHA-256 of the controller-selected deterministic fixture'
        required: false
        default: ''
        type: string
      qsync_three_host_expected_file_size:
        description: 'Byte size of the controller-selected deterministic fixture'
        required: false
        default: ''
        type: string
      qsync_three_host_prebuilt_run_id:
        description: 'Prepare run whose immutable role artifact is reused by execute'
        required: false
        default: ''
        type: string
      qsync_three_host_native_artifact_run_id:
        description: 'Native artifact provenance run (metadata only during execute)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DELTAWEAVE_REQUIRE_WEB_ASSETS: '1'

jobs:
  quality-linux:
    name: Linux quality gates
    if: github.event_name != 'workflow_dispatch' || inputs.qsync_three_host_execute != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build dashboard assets
        run: |
          npm --prefix web ci
          npm --prefix web test -- --run
          npm --prefix web run build
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-targets --all-features --no-fail-fast
      - name: CLI self-test
        run: cargo run --locked --all-features -p deltaweave -- self-test
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features
      - name: Documentation media
        run: |
          bash -n scripts/verify-release.sh
          test -s docs/assets/deltaweave-hero.webp
          test -s docs/assets/deltaweave-quickstart.gif
          test -s docs/assets/deltaweave-index-lifecycle.gif
          test -s docs/assets/deltaweave-sync-lifecycle.gif
          test -s docs/assets/deltaweave-self-test.png
          test -s docs/assets/deltaweave-synology-self-test.png
          test -s docs/assets/portainer-flow.svg
          grep -Fq 'docs/assets/deltaweave-quickstart.gif' README.md
          grep -Fq 'docs/assets/deltaweave-sync-lifecycle.gif' README.md
          grep -Fq 'docs/QUALITY_REPORT_V0.3.md' README.md
          grep -Fq 'assets/deltaweave-index-lifecycle.gif' docs/TESTING_LOCAL_INDEX.md
          grep -Fq 'assets/portainer-flow.svg' docs/AI_PORTAINER_SETUP.md
      - name: Release build
        run: cargo build --locked --workspace --release --all-features

  test-windows:
    name: Windows tests
    if: github.event_name != 'workflow_dispatch' || inputs.qsync_three_host_execute != true
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DELTAWEAVE_WATCH_DIAGNOSTICS: '1'
      DELTAWEAVE_PRIVATE_ACL_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build dashboard assets
        run: |
          npm --prefix web ci
          npm --prefix web test -- --run
          npm --prefix web run build
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Parse managed private ACL script
        shell: pwsh
        run: |
          $source = [System.IO.File]::ReadAllText('crates/deltaweave-control/src/private.rs')
          $match = [System.Text.RegularExpressions.Regex]::Match($source, 'const WINDOWS_ACL_SCRIPT: &str = r#"(?<script>[\s\S]*?)"#;')
          if (-not $match.Success) { Write-Output 'managed private ACL parser: source_marker_missing=1'; exit 1 }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($match.Groups['script'].Value, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            Write-Output ("managed private ACL parser: error_count={0}" -f $errors.Count)
            exit 1
          }
          Write-Output 'managed private ACL parser: error_count=0'
      - name: Probe managed private ACL boundary
        continue-on-error: true
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'deltaweave-private-acl-probe.exe'
          rustc --edition 2024 --test crates/deltaweave-control/src/private.rs -o $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $probe --exact tests::native_acl_preparation_is_idempotent_and_fails_closed --nocapture
          exit $LASTEXITCODE
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --locked --workspace --all-targets --all-features --no-fail-fast
      - run: cargo run --locked --all-features -p deltaweave -- self-test

  qsync-private-acl-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.qsync_three_host_execute != true
    name: QSync private ACL probe
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DELTAWEAVE_PRIVATE_ACL_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Parse managed private ACL script
        shell: pwsh
        run: |
          $source = [System.IO.File]::ReadAllText('crates/deltaweave-control/src/private.rs')
          $match = [System.Text.RegularExpressions.Regex]::Match($source, 'const WINDOWS_ACL_SCRIPT: &str = r#"(?<script>[\s\S]*?)"#;')
          if (-not $match.Success) { Write-Output 'managed private ACL parser: source_marker_missing=1'; exit 1 }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($match.Groups['script'].Value, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            Write-Output ("managed private ACL parser: error_count={0}" -f $errors.Count)
            exit 1
          }
          Write-Output 'managed private ACL parser: error_count=0'
      - name: Probe managed private ACL boundary
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'deltaweave-private-acl-probe.exe'
          rustc --edition 2024 --test crates/deltaweave-control/src/private.rs -o $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $probe --exact tests::native_acl_preparation_is_idempotent_and_fails_closed --nocapture
          exit $LASTEXITCODE

  qsync-native-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.qsync_three_host_execute != true
    uses: ./.github/workflows/qsync-native-artifact.yml

  qsync-three-host-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.qsync_three_host == true && inputs.qsync_three_host_execute != true
    needs: qsync-native-artifact
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/qsync-three-host-bootstrap.yml
    with:
      source_sha: ${{ github.sha }}
      native_artifact_run_id: ${{ inputs.qsync_three_host_native_artifact_run_id || github.run_id }}
      expected_file_hash: ${{ inputs.qsync_three_host_expected_file_hash }}
      expected_file_size: ${{ inputs.qsync_three_host_expected_file_size }}
      execution_mode: prepare
      execute_ro: false
      coordination_run_id: ${{ inputs.qsync_three_host_coordination_id || github.run_id }}
      ro_share_key_secret_name: ${{ inputs.qsync_three_host_ro_secret_name }}
    secrets:
      QSYNC_F_RO_SHARE_KEY: ${{ secrets[inputs.qsync_three_host_ro_secret_name] }}

  qsync-three-host-bootstrap-execute:
    if: github.event_name == 'workflow_dispatch' && inputs.qsync_three_host == true && inputs.qsync_three_host_execute == true
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/qsync-three-host-bootstrap.yml
    with:
      source_sha: ${{ github.sha }}
      native_artifact_run_id: ${{ inputs.qsync_three_host_native_artifact_run_id }}
      prebuilt_role_run_id: ${{ inputs.qsync_three_host_prebuilt_run_id }}
      expected_file_hash: ${{ inputs.qsync_three_host_expected_file_hash }}
      expected_file_size: ${{ inputs.qsync_three_host_expected_file_size }}
      execution_mode: execute
      execute_ro: true
      coordination_run_id: ${{ inputs.qsync_three_host_coordination_id || github.run_id }}
      ro_share_key_secret_name: ${{ inputs.qsync_three_host_ro_secret_name }}
    secrets:
      QSYNC_F_RO_SHARE_KEY: ${{ secrets[inputs.qsync_three_host_ro_secret_name] }}
