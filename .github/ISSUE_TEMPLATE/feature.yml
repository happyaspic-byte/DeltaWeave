name: Feature request
description: Propose a scoped capability or design change
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or correctness problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Safety and compatibility considerations
      description: Note data-loss risks, resource bounds, and wire/on-disk compatibility.
    validations:
      required: true
