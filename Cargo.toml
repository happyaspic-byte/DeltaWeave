[workspace]
resolver = "3"
members = [
    "crates/deltaweave-core",
    "crates/deltaweave-cdc",
    "crates/deltaweave-index",
    "crates/deltaweave-reconcile",
    "crates/deltaweave-store",
    "crates/deltaweave-net",
    "crates/deltaweave-sync",
    "crates/deltaweave-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
authors = ["DeltaWeave contributors"]
repository = "https://github.com/happyaspic-byte/DeltaWeave"
publish = false

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8.7"
clap = { version = "4.5", features = ["derive"] }
fastcdc = "5.0.0"
hex = "0.4.3"
iroh = "1.1.0"
icu_casemap = "2.3.0"
notify = "8.2.0"
postcard = { version = "1.1", features = ["use-std"] }
redb = "4.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.44", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.25"
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
