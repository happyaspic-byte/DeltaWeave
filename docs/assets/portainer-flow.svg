<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">DeltaWeave Windows to Synology Portainer setup flow</title>
  <desc id="desc">Windows verifies and initializes a sender, then pushes through authenticated encrypted P2P transport to a DeltaWeave container on Synology.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf8f7"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2740" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f9f9a"/>
    </marker>
  </defs>

  <rect width="1440" height="560" rx="28" fill="url(#background)"/>
  <text x="720" y="55" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f2740">Windows PC → Synology Portainer Verification</text>
  <text x="720" y="88" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#52708c">Persistent state · allow-listed peers · encrypted transport</text>

  <g filter="url(#shadow)">
    <rect x="70" y="130" width="370" height="260" rx="24" fill="#ffffff" stroke="#c8d9e8" stroke-width="2"/>
    <rect x="1000" y="130" width="370" height="260" rx="24" fill="#ffffff" stroke="#c8d9e8" stroke-width="2"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="125" cy="182" r="28" fill="#e0f2fe"/>
    <rect x="109" y="168" width="32" height="22" rx="3" fill="none" stroke="#0284c7" stroke-width="4"/>
    <path d="M116 198h18M125 190v8" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <text x="170" y="183" font-size="25" font-weight="700" fill="#0f2740">Windows PC</text>
    <text x="105" y="240" font-size="19" fill="#284b68">1. Verify SHA-256 + self-test</text>
    <text x="105" y="280" font-size="19" fill="#284b68">2. Generate sender.key</text>
    <text x="105" y="320" font-size="19" fill="#284b68">3. Push file + verify hash</text>
    <rect x="105" y="344" width="275" height="30" rx="15" fill="#ecfeff"/>
    <text x="242" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">deltaweave.exe</text>

    <circle cx="1055" cy="182" r="28" fill="#ccfbf1"/>
    <path d="M1038 174h34v24h-34zM1044 168h22v6" fill="none" stroke="#0f9f9a" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="1047" cy="186" r="2.5" fill="#0f9f9a"/>
    <circle cx="1055" cy="186" r="2.5" fill="#0f9f9a"/>
    <text x="1100" y="183" font-size="25" font-weight="700" fill="#0f2740">Synology + Portainer</text>
    <text x="1035" y="240" font-size="19" fill="#284b68">1. Pull GHCR multi-arch image</text>
    <text x="1035" y="280" font-size="19" fill="#284b68">2. Keep receiver.key + allow peer</text>
    <text x="1035" y="320" font-size="19" fill="#284b68">3. Persist /data/received</text>
    <rect x="1035" y="344" width="280" height="30" rx="15" fill="#ecfdf5"/>
    <text x="1175" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">linux/amd64 · linux/arm64</text>
  </g>

  <path d="M470 250 C610 145 830 145 970 250" fill="none" stroke="url(#link)" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M970 290 C830 395 610 395 470 290" fill="none" stroke="url(#link)" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="555" y="190" width="330" height="116" rx="22" fill="#0f2740"/>
    <text x="720" y="230" font-size="22" font-weight="700" fill="#ffffff">Authenticated P2P</text>
    <text x="720" y="261" font-size="18" fill="#b9e9f2">iroh · QUIC · TLS 1.3</text>
    <text x="720" y="288" font-size="16" fill="#8ddbd6">FastCDC chunks + BLAKE3 verification</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="150" y="445" width="1140" height="70" rx="22" fill="#ffffff" stroke="#c8d9e8" stroke-width="2"/>
    <circle cx="215" cy="480" r="20" fill="#0ea5e9"/><text x="215" y="487" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="250" y="487" font-size="17" fill="#284b68">Verify package</text>
    <path d="M390 480h85" stroke="#9db5c8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="520" cy="480" r="20" fill="#0ea5e9"/><text x="520" y="487" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="555" y="487" font-size="17" fill="#284b68">Initialize keys</text>
    <path d="M675 480h85" stroke="#9db5c8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="805" cy="480" r="20" fill="#14b8a6"/><text x="805" y="487" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="840" y="487" font-size="17" fill="#284b68">Allow peer</text>
    <path d="M965 480h85" stroke="#9db5c8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="1095" cy="480" r="20" fill="#14b8a6"/><text x="1095" y="487" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
    <text x="1130" y="487" font-size="17" fill="#284b68">Transfer + verify hash</text>
  </g>
</svg>
